name: Build Offline Ludo APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Files
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Create Capacitor Project with Name Ludo King
        run: |
          mkdir -p www
          cp index.html style.css script.js www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Ludo King" "com.ludoroyal3d.offline" --web-dir www
          npx cap add android
          npx cap copy android

      - name: 5. Apply Official Ludo King Play Store Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick curl
          if [ -f "icon.png" ]; then
            cp icon.png raw-icon.png
          else
            curl -L -s "https://play-lh.googleusercontent.com/qSN0Eb6mDVPIX4PRggTB3PsEU1oyPorteUfiuJ709P9cZxdWP9Y-kV0htG7rtJNYywGE-3wlrC_7Gix0h0-Urw=s512" -o raw-icon.png
          fi
          convert raw-icon.png -resize 512x512! app-icon.png
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          RES="android/app/src/main/res"
          convert app-icon.png -resize 48x48   "$RES/mipmap-mdpi/ic_launcher.png"
          convert app-icon.png -resize 48x48   "$RES/mipmap-mdpi/ic_launcher_round.png"
          convert app-icon.png -resize 72x72   "$RES/mipmap-hdpi/ic_launcher.png"
          convert app-icon.png -resize 72x72   "$RES/mipmap-hdpi/ic_launcher_round.png"
          convert app-icon.png -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher.png"
          convert app-icon.png -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher_round.png"
          convert app-icon.png -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert app-icon.png -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          convert app-icon.png -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
          convert app-icon.png -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

      - name: 6. Lock Portrait Mode in AndroidManifest
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/g' android/app/src/main/AndroidManifest.xml

      - name: 7. Build Signed Offline APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Ludo-King.apk

      - name: 8. Upload APK as Downloadable ZIP on GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-King-APK
          path: Ludo-King.apk
