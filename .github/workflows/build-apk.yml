name: Build Offline Ludo APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Isse aap jab chahein manually button daba kar bhi build kar sakte hain

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Files
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK 17 (For Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Create Capacitor Android Project & Copy Game Files
        run: |
          mkdir -p www
          cp index.html style.css script.js www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Ludo Royal 3D" "com.ludoroyal3d.offline" --web-dir www
          npx cap add android
          npx cap copy android

      - name: 5. Lock Portrait Mode in AndroidManifest
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/g' android/app/src/main/AndroidManifest.xml

      - name: 6. Build Signed Offline APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Ludo-Royal-3D.apk

      - name: 7. Upload APK as Downloadable ZIP on GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Royal-3D-APK
          path: Ludo-Royal-3D.apk
