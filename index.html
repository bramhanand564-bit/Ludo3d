<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo 3D Royal - Offline Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        
        <!-- ================= SCREEN 1: MAIN MENU & SELECTION ================= -->
        <div id="menu-screen" class="screen active">
            <div class="logo-header">
                <div class="crown-icon">👑</div>
                <h1 class="game-title">LUDO <span>ROYAL 3D</span></h1>
            </div>

            <!-- Token Selection (All Unlocked) -->
            <div class="panel-box">
                <div class="panel-header">SELECT TOKEN (ALL UNLOCKED)</div>
                <div class="token-selector">
                    <div class="token-option selected" data-token="pin">📍<span>Classic</span></div>
                    <div class="token-option" data-token="star">⭐<span>Star</span></div>
                    <div class="token-option" data-token="hammer">🔨<span>Thor</span></div>
                    <div class="token-option" data-token="crown">👑<span>King</span></div>
                    <div class="token-option" data-token="rocket">🚀<span>Cyber</span></div>
                </div>
            </div>

            <!-- Game Mode Selection -->
            <div class="panel-box">
                <div class="panel-header">SELECT GAME MODE</div>
                <div class="mode-list">
                    <label class="mode-card selected" data-mode="local">
                        <div class="mode-icon">👥</div>
                        <div class="mode-info">
                            <h3>Local Player</h3>
                            <p>Pass & Play with Friends</p>
                        </div>
                        <div class="radio-circle"></div>
                    </label>

                    <label class="mode-card" data-mode="computer">
                        <div class="mode-icon">🤖</div>
                        <div class="mode-info">
                            <h3>Play vs Computer</h3>
                            <p>Smart Offline AI</p>
                        </div>
                        <div class="radio-circle"></div>
                    </label>
                </div>
            </div>

            <button id="btn-to-setup" class="btn-3d gold-btn">NEXT</button>
        </div>

        <!-- ================= SCREEN 2: PLAYER & COLOR SETUP ================= -->
        <div id="setup-screen" class="screen">
            <div class="panel-box">
                <div class="panel-header">CHOOSE COLOR & PLAYERS</div>
                
                <div class="player-count-tabs">
                    <button class="count-btn active" data-count="2">2P</button>
                    <button class="count-btn" data-count="3">3P</button>
                    <button class="count-btn" data-count="4">4P</button>
                </div>

                <div class="players-input-list">
                    <div class="player-row" data-color="blue">
                        <span class="color-dot blue"></span>
                        <input type="text" value="Player 1" id="name-blue">
                        <span class="dice-mini">🎲</span>
                    </div>
                    <div class="player-row" data-color="green">
                        <span class="color-dot green"></span>
                        <input type="text" value="Player 2" id="name-green">
                        <span class="dice-mini">🎲</span>
                    </div>
                    <div class="player-row hidden" data-color="red">
                        <span class="color-dot red"></span>
                        <input type="text" value="Player 3" id="name-red">
                        <span class="dice-mini">🎲</span>
                    </div>
                    <div class="player-row hidden" data-color="yellow">
                        <span class="color-dot yellow"></span>
                        <input type="text" value="Player 4" id="name-yellow">
                        <span class="dice-mini">🎲</span>
                    </div>
                </div>
            </div>

            <div class="setup-buttons">
                <button id="btn-play-normal" class="btn-3d gold-btn">PLAY CLASSIC</button>
                <button id="btn-play-quick" class="btn-3d blue-btn">
                    PLAY<br><small>- One Token Out -</small>
                </button>
            </div>
            <button id="btn-back-menu" class="btn-back">↩</button>
        </div>

        <!-- ================= SCREEN 3: 3D GAME BOARD ================= -->
        <div id="game-screen" class="screen">
            
            <!-- Top Player HUDs (Red & Green) -->
            <div class="hud-row top-hud">
                <div id="hud-red" class="player-hud red-hud inactive">
                    <div class="hud-name">Player 3</div>
                    <div class="hud-controls">
                        <div class="token-badge red"></div>
                        <div class="dice-box" data-player="red">
                            <div class="dice-3d" id="dice-red">🎲</div>
                        </div>
                    </div>
                </div>

                <div id="hud-green" class="player-hud green-hud">
                    <div class="hud-name">Player 2</div>
                    <div class="hud-controls">
                        <div class="dice-box" data-player="green">
                            <div class="dice-3d" id="dice-green">🎲</div>
                        </div>
                        <div class="token-badge green"></div>
                    </div>
                </div>
            </div>

            <!-- 3D Ludo Board Container -->
            <div class="board-wrapper">
                <div id="ludo-board" class="ludo-board">
                    <!-- JS (Part 2) will dynamically generate the exact 15x15 grid, bases, stars, and 3D tokens here -->
                </div>
            </div>

            <!-- Bottom Player HUDs (Blue & Yellow) -->
            <div class="hud-row bottom-hud">
                <div id="hud-blue" class="player-hud blue-hud active-turn">
                    <div class="hud-controls">
                        <div class="token-badge blue"></div>
                        <div class="dice-box" data-player="blue">
                            <div class="dice-3d" id="dice-blue">🎲</div>
                        </div>
                    </div>
                    <div class="hud-name">Player 1</div>
                </div>

                <div id="hud-yellow" class="player-hud yellow-hud inactive">
                    <div class="hud-controls">
                        <div class="dice-box" data-player="yellow">
                            <div class="dice-3d" id="dice-yellow">🎲</div>
                        </div>
                        <div class="token-badge yellow"></div>
                    </div>
                    <div class="hud-name">Player 4</div>
                </div>
            </div>

            <button id="btn-leave-game" class="btn-back">🏠</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
